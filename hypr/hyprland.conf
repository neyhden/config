
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=eDP-1, preferred, auto, 1
monitor=, preferred, auto, 1

exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

windowrule = opacity 0.0 override 0.0 override, match:class ^(xwaylandvideobridge)$
windowrule = no_anim on, match:class ^(xwaylandvideobridge)$
windowrule = no_initial_focus on, match:class ^(xwaylandvideobridge)$
windowrule = max_size 1 1, match:class ^(xwaylandvideobridge)$
windowrule = no_blur on, match:class ^(xwaylandvideobridge)$

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
exec-once = hyprpaper & eww o bar

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Set programs that you use
$terminal = kitty
$fileManager = kitty -e yazi
$menu = wofi
$killwindow = kill -9 $(hyprctl activewindow | awk '/pid:/ {print $2}')
$screenshot = grimblast --freeze save area - | swappy -f -
$screenshotall = grim - | wl-copy

# Some default env vars.
env = QT_QPA_PLATFORMTHEME,qt5ct # change to qt6ct if you have that

# use intel gpu
 env = AQ_DRM_DEVICES,/dev/dri/card1
 env = WLR_DRM_DEVICES,/dev/dri/card1

# cursor
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,24

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = es
    kb_variant =
    kb_model =
# options at /usr/share/X11/xkb/rules/base.lst
    kb_options = caps:super
    kb_rules =
    numlock_by_default = true

    follow_mouse = 1
    sensitivity = -0.8 # -1.0 - 1.0, 0 means no modification.

# scroll_method = on_button_down
# scroll_button = 274

    touchpad {
        natural_scroll = true
        disable_while_typing = true
	    scroll_factor = 0.1
    }
    tablet {
        left_handed = true
        # left_handed = false
        # active_area_size = 40 50
        # active_area_position = 0 40
    }
}

device {
    name = cust0001:00-04f3:30fa-touchpad
    enabled = false
    sensitivity = 0.3
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 2
    gaps_out = 10
    border_size = 3
    col.active_border = rgba(ffffccff)
    col.inactive_border = rgba(555566ff)

    layout = master

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
}

master {
    mfact = 0.50
}

dwindle {
    pseudotile = no
    force_split = 2
    preserve_split = yes
}

cursor {
    no_warps = true
}

misc {
    disable_hyprland_logo = true
    middle_click_paste = false
}

decoration {
    rounding = 10
    blur {
        enabled = false
        size = 5
        passes = 1
    }

    shadow {
        enabled = false
    }

    dim_inactive = false
    dim_strength = 0.05
}

animations {
    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

# enabled = yes
# bezier = myBezier, 0.22, 1, 0.36, 1
# animation = windows, 1, 5, myBezier, slide
# animation = fade, 1, 3, default
# animation = workspaces, 1, 3, myBezier

    bezier = ease, 0.22, 1, 0.36, 1
    bezier = zoink, 0.13, 0.99, 0.29, 1.1
    animation = windows, 1, 5, ease, slide right
    animation = windowsOut, 1, 5, ease, popin
    animation = fade, 1, 5, ease
    animation = workspaces, 1, 3, ease, slide
    animation = layers, 1, 3, ease, popin 50%
}

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, C, killactive, 
bind = $mainMod SHIFT, C, exec, $killwindow 
bind = $mainMod SHIFT, M, exit, 
bind = $mainMod, M, exec, hyprlock
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating, 
bind = $mainMod, F, fullscreen, 
bind = $mainMod, R, exec, $menu
bind = $mainMod SHIFT, S, exec, $screenshot
bind =, Print, exec, $screenshotall

bind = $mainMod SHIFT, K, swapwindow, u
bind = $mainMod SHIFT, H, swapwindow, l
bind = $mainMod SHIFT, J, swapwindow, d
bind = $mainMod SHIFT, L, swapwindow, r
bind = $mainMod CTRL, H, layoutmsg, mfact -0.1
bind = $mainMod CTRL, L, layoutmsg, mfact 0.1
bind = $mainMod CTRL, K, resizeactive, 0 10%
bind = $mainMod CTRL, J, resizeactive, 0 -10%

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
#bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod, P, pin

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Audio
bindel=, XF86AudioRaiseVolume, exec, ~/.config/hypr/volume.sh --up
bindel=, XF86AudioLowerVolume, exec, ~/.config/hypr/volume.sh --down
bindl=, XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindel=, XF86AudioNext, exec, mpc next
bindel=, XF86AudioPrev, exec, mpc prev
bindel=, XF86AudioPlay, exec, mpc toggle
bindl= CTRL, F3, exec, ~/.config/hypr/touchpad.sh

# Brightness
bindel=, XF86MonBrightnessUp, exec, brightnessctl s 1%+
bindel=, XF86MonBrightnessDown, exec, brightnessctl s 1%-

# window rules
windowrule = no_initial_focus on, match:class ^krita$, match:title ^Krita$, match:float on
windowrule = tile on, match:class Minecraft\ Launcher
windowrule = float on, center on, match:class python3

windowrule = border_color rgb(FF0000), match:pin on
windowrule = no_dim on, match:fullscreen on

# layer rules
layerrule = no_anim on, match:namespace selection
layerrule = no_anim on, match:namespace hyprpicker
layerrule = animation slide top, match:namespace slidedown
